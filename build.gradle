plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.9'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'toIT Backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.mysql:mysql-connector-j'
	// MySQL 전환 검증 기간 동안 롤백용으로 유지 (드라이버/방언 두 줄만 되돌리면 복귀)
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	/***
	 * lombok 라이브러리
	 */
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'

	/***
	 * Swagger 라이브러리
	 */
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9'

	/**
	 * Jsoup 라이브러리 -> 링크의 본문, 링크의 제목, 링크의 썸네일
	 */
	implementation 'org.jsoup:jsoup:1.22.1'

	/**
	 * S3 의존성 추가
	 */
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.1.1'

	/**
	 * .env 읽기 → application.properties로 대체 (.gitignore로 git 미추적)
	 */
	// implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	/***
	 * 	FCM 의존성 추가
 	 */
	implementation 'com.google.firebase:firebase-admin:9.4.2'

	/***
	 * OAuth2 로그인 구현을 위한 핵심 의존성 (카카오 인가 서버와의 통신 담당)
 	 */
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

	/***
	 * 	2. JWT 생성을 위한 라이브러리 (JJWT)
	 * 	최신 버전인 0.12.x를 사용
	 */
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	/**
	 * Grafana Cloud 의존성을 위해 프로메테우스
 	*/
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
	}
}
